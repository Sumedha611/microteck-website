<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Us – Microteck</title>
  <link rel="stylesheet" href="Contactcss.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>

<body>

  <!-- HEADER -->
  <header class="header">
   <h1 class="company-name">Kaveri Microteck Private Limited</h1>
  </header>

  <!-- MAIN CONTENT -->
  <div class="main-content">
<main class="main-content">
    <section class="contact-container">

      <div class="info-box">
        <h2>Get in Touch</h2>

        <div class="info-item">
          <h3>Registered Office</h3>
          <p>
            #1-7-36 to 42, Sardar Patel Road,<br>
            Secunderabad, 500003,<br>
            Telangana, India
          </p>
        </div>

        <div class="info-item">
          <h3>📞 Phone</h3>
          <p><a href="tel:+919876543210">+91 98765 43210</a></p>
        </div>

    <div class="info-item">
  <h3>📧 Email</h3>
  
  <!-- Email link (opens Gmail compose) -->
  <p>
    <a href="https://mail.google.com/mail/?view=cm&to=microteck@company.com" target="_blank">
      microteck@company.com
    </a>
  </p>
  <!-- Copy button -->
  <button onclick="copyEmail()">Copy Email</button>
</div>
  </main>
<footer class="footer">
    <p>© 2025 Kaveri Microteck. All Rights Reserved.</p>
</footer>
<script>
function copyEmail() {
  const email = "microteck@company.com";
  navigator.clipboard.writeText(email)
    .then(() => {
      alert("Email copied to clipboard!");
    })
    .catch(err => {
      console.error("Failed to copy: ", err);
    });
}
</script>
</body>
</html>
